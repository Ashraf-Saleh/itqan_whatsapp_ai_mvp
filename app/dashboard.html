<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITQAN WhatsApp AI MVP</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#182033}.wrap{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 4px 18px #0001}input,textarea,button{box-sizing:border-box;width:100%;padding:10px;margin:5px 0;border:1px solid #ccd3df;border-radius:8px}button{background:#030A8C;color:white;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}.chat{height:330px;overflow:auto;background:#f8fafc;padding:10px;border-radius:8px}.msg{padding:9px;margin:7px;border-radius:10px;white-space:pre-wrap}.me{background:#dbeafe;margin-left:20%}.bot{background:#e9f7ef;margin-right:20%}.small{font-size:12px;color:#667}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>ITQAN WhatsApp Real Estate AI MVP</h1><p>Test locally first, then connect Meta Cloud API.</p><div class="grid"><div class="card"><h2>Local Simulator</h2><input id="key" type="password" value="change-me-now" placeholder="Admin API key"><input id="phone" value="+201000000001"><textarea id="message" placeholder="e.g. عايز شقة في التجمع الخامس"></textarea><button onclick="sendMsg()">Send to AI</button><div id="status" class="small"></div><div id="chat" class="chat"></div></div><div class="card"><h2>Lead Pipeline</h2><button onclick="loadLeads()">Refresh leads</button><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Requirements</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script>const headers=()=>({'X-API-Key':key.value,'Content-Type':'application/json'});function add(c,t){chat.innerHTML+=`<div class="msg ${c}">${t.replaceAll('<','&lt;')}</div>`;chat.scrollTop=chat.scrollHeight}async function sendMsg(){let m=message.value.trim();if(!m)return;add('me',m);message.value='';let r=await fetch('/api/simulator/message',{method:'POST',headers:headers(),body:JSON.stringify({phone:phone.value,name:'Test Client',message:m})});let d=await r.json();if(!r.ok){add('bot',JSON.stringify(d));return}add('bot',d.reply);status.textContent=`Status: ${d.status} | Handoff: ${d.handoff}`;loadLeads()}async function loadLeads(){let r=await fetch('/api/leads',{headers:{'X-API-Key':key.value}});if(!r.ok){alert('Check API key');return}let d=await r.json();rows.innerHTML=d.map(x=>`<tr><td>${x.name||''}</td><td>${x.phone}</td><td>${x.status}</td><td>${[x.job,x.education,x.location,x.unit_type,x.unit_size?`${x.unit_size}m2`:null,(x.budget_min||x.budget_max)?`${x.budget_min||'?'}-${x.budget_max||'?'} EGP`:null].filter(Boolean).join(' · ')}</td></tr>`).join('')}loadLeads();</script></body></html>
